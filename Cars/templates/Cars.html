{% extends "Layout/Layout.html" %}


{% block title %}
<h3 class="tital">AutoDrive | Cars</h3>
{% endblock title %}


{% block content1 %}

<section id="cars" class="section-padding">
    <h2 class="section-title">Our Collection</h2>
    <div class="car-grid">
        {% for Car in Cars%}             <div class="car-item">
              <img src="{{Car.image.url}}" alt="Car.model_name">
              <h3 id="Top_Speed">{{Car.Top_Speed}}</h3>
              <h3 id="model_name">{{Car.model_name}}</h3>
              <p id="price">${{Car.price}}</p>
           </div>
        {%endfor%}
    </div>
</section>

{%endblock content1%}
